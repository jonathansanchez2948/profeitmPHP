name: Despliegue FTP

# Se ejecuta en cada push a main y también de forma manual
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  desplegar:
    name: Desplegar a FTP
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Obtener el código
        uses: actions/checkout@v4

      # Sube los archivos al servidor FTP (solo los que cambiaron)
      - name: Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.vscode/**
            README.md
