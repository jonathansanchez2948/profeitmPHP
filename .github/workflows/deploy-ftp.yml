name: Despliegue FTP

# Se ejecuta en cada push a main y también de forma manual
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pruebas:
    name: Probar la página principal
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # Instala PHP en el runner para ejecutar las pruebas
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Valida sintaxis y responde HTTP 200 con el contenido esperado
      - name: Ejecutar pruebas de humo
        run: bash tests/test-index.sh

  desplegar:
    name: Desplegar a FTP
    needs: pruebas # Solo despliega si las pruebas pasan
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Obtener el código
        uses: actions/checkout@v4

      # Sube los archivos al servidor FTP (solo los que cambiaron)
      - name: Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            **/.vscode/**
            README.md
